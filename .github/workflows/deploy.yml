name: CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Terraform Init
        run: cd infrastructure && terraform init
      - name: Terraform Plan
        run: cd infrastructure && terraform plan -out=tfplan
      - name: Terraform Apply
        run: cd infrastructure && terraform apply tfplan
      - name: Generate Frontend Config
        run: |
          API_URL=$(terraform -chdir=infrastructure output -raw api_url)
          echo "const API_URL = '${API_URL}';" > frontend/config.js
      - name: Sync Frontend to S3
        run: |
          BUCKET=$(terraform -chdir=infrastructure output -raw bucket_name)
          aws s3 sync frontend/ s3://$BUCKET/
      - name: Create CloudFront Invalidation
        run: |
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items[0]=='$(terraform -chdir=infrastructure output -raw cloudfront_url | cut -d'.' -f1).cloudfront.net']" --output text)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
      - name: Smoke Test
        run: |
          FRONTEND_URL="https://$(terraform -chdir=infrastructure output -raw cloudfront_url)"
          API_URL="$(terraform -chdir=infrastructure output -raw api_url)"
          echo "Testing frontend: $FRONTEND_URL"
          curl --fail --silent --show-error "$FRONTEND_URL" || exit 1
          echo "Testing API: $API_URL"
          curl --fail --silent --show-error "$API_URL" || exit 1
          echo "✅ Smoke tests passed!"