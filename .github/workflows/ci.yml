name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install boto3 flake8
      - name: Lint Python
        run: flake8 backend/lambda_function.py --max-line-length=120 --ignore=F403,F405

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      - name: Terraform Init
        run: cd infrastructure && terraform init -backend=false
      - name: Terraform Validate
        run: cd infrastructure && terraform validate
      - name: Terraform Format
        run: cd infrastructure && terraform fmt -check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./
          framework: terraform