name: CineVerse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint
        run: flake8 backend/lambda_function.py --max-line-length=120 --ignore=E501,F403,F405,W503
      - name: Unit tests
        run: pytest tests/unit/ -v --cov=backend --cov-report=term-missing --cov-fail-under=80

  infrastructure:
    name: CloudFormation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cfn-lint
        run: pipx install cfn-lint
      - name: Lint template
        run: cfn-lint infrastructure/cineverse.yaml --ignore-checks W3011

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3
      - name: Checkov CloudFormation scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure
          framework: cloudformation

  frontend:
    name: Frontend sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/styles.css
          test -f frontend/app.js
          test -f frontend/config.example.js
      - name: Check for accidental secrets
        run: |
          ! grep -RniE 'AKIA[0-9A-Z]{16}|aws_secret_access_key|password[[:space:]]*=' frontend backend infrastructure || true
