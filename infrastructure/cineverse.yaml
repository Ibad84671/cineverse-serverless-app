AWSTemplateFormatVersion: '2010-09-09'
Description: CineVerse production-inspired serverless movie discovery platform.

Parameters:
  ProjectName:
    Type: String
    Default: cineverse
    AllowedPattern: '^[a-z0-9-]+$'
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: '^[a-z0-9-]+$'
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito hosted UI domain prefix.
    AllowedPattern: '^[a-z0-9-]+$'
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${EnvironmentName}-oac'
        Description: CloudFront OAC for private CineVerse S3 origin
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: CineVerseS3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt FrontendOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: CineVerseS3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Restrictions:
          GeoRestriction:
            RestrictionType: none
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  MovieTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: MovieId
          AttributeType: S
      KeySchema:
        - AttributeName: MovieId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  UserLibraryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: UserId
          AttributeType: S
        - AttributeName: MovieId
          AttributeType: S
      KeySchema:
        - AttributeName: UserId
          KeyType: HASH
        - AttributeName: MovieId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${EnvironmentName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${ProjectName}-${EnvironmentName}-web'
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !Sub 'https://${FrontendDistribution.DomainName}/'
      LogoutURLs:
        - !Sub 'https://${FrontendDistribution.DomainName}/'
      SupportedIdentityProviders: [COGNITO]

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      UserPoolId: !Ref UserPool
      Description: CineVerse administrators
      Precedence: 10

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ProjectName}-${EnvironmentName}'
      RetentionInDays: !Ref LogRetentionDays

  LambdaLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${EnvironmentName}-api'
      RetentionInDays: !Ref LogRetentionDays

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CineVerseDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt MovieTable.Arn
                  - !GetAtt UserLibraryTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LambdaLogs.Arn

  MovieApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api'
      Runtime: python3.12
      Handler: index.lambda_handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          MOVIE_TABLE_NAME: !Ref MovieTable
          LIBRARY_TABLE_NAME: !Ref UserLibraryTable
          ALLOWED_ORIGIN: !Sub 'https://${FrontendDistribution.DomainName}'
      Code:
        ZipFile: |
          import base64, json, logging, math, os, uuid
          from datetime import datetime, timezone
          import boto3
          from botocore.exceptions import ClientError
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          db = boto3.resource('dynamodb')
          movies = db.Table(os.environ['MOVIE_TABLE_NAME'])
          library = db.Table(os.environ['LIBRARY_TABLE_NAME'])
          ORIGIN = os.environ['ALLOWED_ORIGIN']
          FIELDS = {'MovieName','Genre','Language','Rating','ReleaseYear','Director','Remark','PosterUrl','BackdropUrl','Overview','Runtime'}
          def res(code, data):
              return {'statusCode': code, 'headers': {'Content-Type':'application/json','Access-Control-Allow-Origin':ORIGIN,'Access-Control-Allow-Headers':'Content-Type,Authorization','Access-Control-Allow-Methods':'GET,POST,PUT,DELETE,OPTIONS'}, 'body':json.dumps(data, default=str)}
          def user(event):
              return (event.get('requestContext',{}).get('authorizer',{}).get('claims',{}) or {}).get('sub')
          def admin(event):
              groups = (event.get('requestContext',{}).get('authorizer',{}).get('claims',{}) or {}).get('cognito:groups','')
              return 'admins' in (set(groups.split(',')) if isinstance(groups,str) else set(groups or []))
          def body(event):
              try: return json.loads(event.get('body') or '{}')
              except json.JSONDecodeError: return None
          def validate(d, update=False):
              if not isinstance(d,dict): return ['Request body must be a JSON object']
              if not update and not str(d.get('MovieName','')).strip(): return ['MovieName is required']
              errors=[]
              for k,v in d.items():
                  if k not in FIELDS: errors.append(f'Unsupported field: {k}')
                  if k in {'MovieName','Genre','Language','Director','Remark','PosterUrl','BackdropUrl','Overview'} and not isinstance(v,str): errors.append(f'{k} must be a string')
              if 'Rating' in d:
                  try:
                      x=float(d['Rating'])
                      if not math.isfinite(x) or x<0 or x>10: errors.append('Rating must be between 0 and 10')
                  except: errors.append('Rating must be a number')
              if 'ReleaseYear' in d:
                  try:
                      x=int(d['ReleaseYear'])
                      if x<1888 or x>datetime.now(timezone.utc).year+2: errors.append('ReleaseYear is out of range')
                  except: errors.append('ReleaseYear must be an integer')
              return errors
          def token_encode(key):
              return base64.urlsafe_b64encode(json.dumps(key).encode()).decode().rstrip('=')
          def token_decode(token):
              try: return json.loads(base64.urlsafe_b64decode(token+'===').decode())
              except: return None
          def get_movies(event):
              q=event.get('queryStringParameters') or {}
              limit=min(max(int(q.get('limit','24')),1),100) if str(q.get('limit','24')).isdigit() else 24
              args={'Limit':limit}
              if q.get('nextToken'):
                  key=token_decode(q['nextToken'])
                  if not key: return res(400,{'success':False,'error':'Invalid pagination token'})
                  args['ExclusiveStartKey']=key
              try:
                  out=movies.scan(**args)
                  data={'success':True,'data':out.get('Items',[]),'count':len(out.get('Items',[]))}
                  if out.get('LastEvaluatedKey'): data['nextToken']=token_encode(out['LastEvaluatedKey'])
                  return res(200,data)
              except ClientError:
                  logger.exception('Movie scan failed')
                  return res(500,{'success':False,'error':'Unable to load movies'})
          def get_movie(event,movie_id):
              try:
                  item=movies.get_item(Key={'MovieId':movie_id}).get('Item')
                  return res(200,{'success':True,'data':item}) if item else res(404,{'success':False,'error':'Movie not found'})
              except ClientError:
                  logger.exception('Movie lookup failed'); return res(500,{'success':False,'error':'Unable to load movie'})
          def create_movie(event):
              uid=user(event)
              if not uid: return res(401,{'success':False,'error':'Authentication required'})
              d=body(event); errors=validate(d)
              if errors: return res(400,{'success':False,'error':'Validation failed','details':errors})
              now=datetime.now(timezone.utc).isoformat(); mid=str(uuid.uuid4())
              item={'MovieId':mid,'MovieName':d['MovieName'].strip(),'createdBy':uid,'createdAt':now,'updatedAt':now}
              for k in FIELDS-{'MovieName'}: 
                  if k in d: item[k]=d[k]
              try:
                  movies.put_item(Item=item,ConditionExpression='attribute_not_exists(MovieId)')
                  return res(201,{'success':True,'data':item})
              except ClientError:
                  logger.exception('Movie create failed'); return res(500,{'success':False,'error':'Unable to create movie'})
          def update_movie(event,mid):
              uid=user(event)
              if not uid: return res(401,{'success':False,'error':'Authentication required'})
              d=body(event); errors=validate(d,True)
              if errors: return res(400,{'success':False,'error':'Validation failed','details':errors})
              try: old=movies.get_item(Key={'MovieId':mid}).get('Item')
              except ClientError: logger.exception('Ownership lookup failed'); return res(500,{'success':False,'error':'Unable to update movie'})
              if not old: return res(404,{'success':False,'error':'Movie not found'})
              if old.get('createdBy')!=uid and not admin(event): return res(403,{'success':False,'error':'You can only edit your own movies'})
              names={}; vals={':u':datetime.now(timezone.utc).isoformat()}; parts=['updatedAt = :u']
              for k,v in d.items(): names['#'+k]=k; vals[':'+k]=v; parts.append('#'+k+' = :'+k)
              try:
                  out=movies.update_item(Key={'MovieId':mid},UpdateExpression='SET '+', '.join(parts),ExpressionAttributeNames=names,ExpressionAttributeValues=vals,ReturnValues='ALL_NEW')
                  return res(200,{'success':True,'data':out['Attributes']})
              except ClientError: logger.exception('Movie update failed'); return res(500,{'success':False,'error':'Unable to update movie'})
          def delete_movie(event,mid):
              if not user(event): return res(401,{'success':False,'error':'Authentication required'})
              if not admin(event): return res(403,{'success':False,'error':'Admin access required'})
              try:
                  out=movies.delete_item(Key={'MovieId':mid},ReturnValues='ALL_OLD')
                  return res(200,{'success':True,'message':'Movie deleted'}) if out.get('Attributes') else res(404,{'success':False,'error':'Movie not found'})
              except ClientError: logger.exception('Movie delete failed'); return res(500,{'success':False,'error':'Unable to delete movie'})
          def watchlist(event):
              uid=user(event)
              if not uid: return res(401,{'success':False,'error':'Authentication required'})
              method=event.get('httpMethod')
              mid=(event.get('pathParameters') or {}).get('movie_id')
              try:
                  if method=='GET': return res(200,{'success':True,'data':library.query(KeyConditionExpression=boto3.dynamodb.conditions.Key('UserId').eq(uid)).get('Items',[])})
                  if method=='PUT' and mid:
                      item=movies.get_item(Key={'MovieId':mid}).get('Item')
                      if not item: return res(404,{'success':False,'error':'Movie not found'})
                      library.put_item(Item={'UserId':uid,'MovieId':mid,'MovieName':item.get('MovieName',''),'Genre':item.get('Genre',''),'Rating':item.get('Rating',0),'addedAt':datetime.now(timezone.utc).isoformat()})
                      return res(200,{'success':True,'message':'Added to watchlist'})
                  if method=='DELETE' and mid:
                      library.delete_item(Key={'UserId':uid,'MovieId':mid}); return res(200,{'success':True,'message':'Removed from watchlist'})
                  return res(400,{'success':False,'error':'Invalid watchlist request'})
              except ClientError: logger.exception('Watchlist operation failed'); return res(500,{'success':False,'error':'Unable to update watchlist'})
          def lambda_handler(event,context):
              method=event.get('httpMethod'); path=event.get('path','')
              logger.info('request method=%s path=%s requestId=%s',method,path,getattr(context,'aws_request_id','-'))
              try:
                  if method=='OPTIONS': return res(204,{})
                  if path.endswith('/watchlist') or '/watchlist/' in path: return watchlist(event)
                  mid=(event.get('pathParameters') or {}).get('movie_id')
                  if method=='GET': return get_movie(event,mid) if mid else get_movies(event)
                  if method=='POST': return create_movie(event)
                  if method=='PUT' and mid: return update_movie(event,mid)
                  if method=='DELETE' and mid: return delete_movie(event,mid)
                  return res(405,{'success':False,'error':'Method not allowed'})
              except Exception:
                  logger.exception('Unhandled request failure'); return res(500,{'success':False,'error':'Internal server error','requestId':getattr(context,'aws_request_id','-')})

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}'
      EndpointConfiguration:
        Types: [REGIONAL]

  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CineVerseCognitoAuthorizer
      RestApiId: !Ref Api
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs: [!GetAtt UserPool.Arn]

  MoviesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: movies
  MovieResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !Ref MoviesResource
      PathPart: '{movie_id}'
  WatchlistResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: watchlist
  WatchlistMovieResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !Ref WatchlistResource
      PathPart: '{movie_id}'

  ApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MovieApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*'

  GetMovies:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref MoviesResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'
  PostMovie:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref MoviesResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'
  GetMovie:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref MovieResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'
  PutMovie:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref MovieResource
      HttpMethod: PUT
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'
  DeleteMovie:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref MovieResource
      HttpMethod: DELETE
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'
  GetWatchlist:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref WatchlistResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'
  PutWatchlist:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref WatchlistMovieResource
      HttpMethod: PUT
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'
  DeleteWatchlist:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref WatchlistMovieResource
      HttpMethod: DELETE
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [GetMovies, PostMovie, GetMovie, PutMovie, DeleteMovie, GetWatchlist, PutWatchlist, DeleteWatchlist]
    Properties:
      RestApiId: !Ref Api
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref EnvironmentName
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          DataTraceEnabled: false
          LoggingLevel: INFO
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","status":"$context.status","httpMethod":"$context.httpMethod","path":"$context.path","latency":"$context.responseLatency"}'

Outputs:
  FrontendBucketName:
    Value: !Ref FrontendBucket
  CloudFrontDomainName:
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendUrl:
    Value: !Sub 'https://${FrontendDistribution.DomainName}/'
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}/movies'
  CognitoUserPoolId:
    Value: !Ref UserPool
  CognitoClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.${AWS::URLSuffix}'
  MovieTableName:
    Value: !Ref MovieTable
  WatchlistTableName:
    Value: !Ref UserLibraryTable
