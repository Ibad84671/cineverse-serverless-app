AWSTemplateFormatVersion: '2010-09-09'
Description: CineVerse serverless movie discovery platform - CloudFormation source of truth.

Parameters:
  ProjectName:
    Type: String
    Default: cineverse
    AllowedPattern: '^[a-z0-9-]+$'
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: '^[a-z0-9-]+$'
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito managed-login domain prefix.
    AllowedPattern: '^[a-z0-9-]+$'
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref EnvironmentName}

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${EnvironmentName}-oac'
        Description: Private S3 origin access control
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: CineVerseS3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt FrontendOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: CineVerseS3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html}
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        Restrictions:
          GeoRestriction: {RestrictionType: none}
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref EnvironmentName}

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  MovieTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: MovieId, AttributeType: S}]
      KeySchema: [{AttributeName: MovieId, KeyType: HASH}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  UserLibraryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: UserId, AttributeType: S}
        - {AttributeName: MovieId, AttributeType: S}
      KeySchema:
        - {AttributeName: UserId, KeyType: HASH}
        - {AttributeName: MovieId, KeyType: RANGE}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${EnvironmentName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${ProjectName}-${EnvironmentName}-web'
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: [!Sub 'https://${FrontendDistribution.DomainName}/']
      LogoutURLs: [!Sub 'https://${FrontendDistribution.DomainName}/']
      SupportedIdentityProviders: [COGNITO]

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      UserPoolId: !Ref UserPool
      Description: CineVerse catalog administrators
      Precedence: 10

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ProjectName}-${EnvironmentName}'
      RetentionInDays: !Ref LogRetentionDays

  LambdaLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${EnvironmentName}-api'
      RetentionInDays: !Ref LogRetentionDays

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: CineVerseDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Scan, dynamodb:Query]
                Resource: [!GetAtt MovieTable.Arn, !GetAtt UserLibraryTable.Arn]
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LambdaLogs.Arn

  MovieApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-api'
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          MOVIE_TABLE_NAME: !Ref MovieTable
          LIBRARY_TABLE_NAME: !Ref UserLibraryTable
          ALLOWED_ORIGIN: !Sub 'https://${FrontendDistribution.DomainName}'
      Code:
        ZipFile: |
          import base64,json,logging,math,os,uuid
          from datetime import datetime,timezone
          import boto3
          from boto3.dynamodb.conditions import Key
          log=logging.getLogger();log.setLevel(logging.INFO)
          db=boto3.resource('dynamodb');movies=db.Table(os.environ['MOVIE_TABLE_NAME']);library=db.Table(os.environ['LIBRARY_TABLE_NAME']);ORIGIN=os.environ['ALLOWED_ORIGIN']
          FIELDS={'MovieName','Genre','Language','Rating','ReleaseYear','Director','Remark','PosterUrl','BackdropUrl','Overview','Runtime'}
          def out(code,data):
            return {'statusCode':code,'headers':{'Content-Type':'application/json','Access-Control-Allow-Origin':ORIGIN,'Access-Control-Allow-Headers':'Content-Type,Authorization','Access-Control-Allow-Methods':'GET,POST,PUT,DELETE,OPTIONS','Cache-Control':'no-store'},'body':json.dumps(data,default=str)}
          def claims(e): return e.get('requestContext',{}).get('authorizer',{}).get('claims',{}) or {}
          def uid(e): return claims(e).get('sub')
          def admin(e):
            g=claims(e).get('cognito:groups','');g=set(g.split(',')) if isinstance(g,str) else set(g or []);return 'admins' in g
          def body(e):
            try:return json.loads(e.get('body') or '{}')
            except json.JSONDecodeError:return None
          def validate(d,update=False):
            if not isinstance(d,dict):return ['Request body must be a JSON object']
            er=[]
            if not update and not str(d.get('MovieName','')).strip():er.append('MovieName is required')
            if 'MovieName' in d and (not isinstance(d['MovieName'],str) or len(d['MovieName'])>200):er.append('MovieName must be a string with 1-200 characters')
            for k,v in d.items():
              if k not in FIELDS:er.append(f'Unsupported field: {k}')
              if k in {'Genre','Language','Director','Remark','PosterUrl','BackdropUrl','Overview'} and not isinstance(v,str):er.append(f'{k} must be a string')
            if 'Rating' in d:
              try:
                x=float(d['Rating'])
                if not math.isfinite(x) or x<0 or x>10:er.append('Rating must be between 0 and 10')
              except (ValueError,TypeError):er.append('Rating must be a number')
            if 'ReleaseYear' in d:
              try:
                x=int(d['ReleaseYear'])
                if x<1900 or x>datetime.now(timezone.utc).year+2:er.append('ReleaseYear is out of range')
              except (ValueError,TypeError):er.append('ReleaseYear must be an integer')
            return er
          def tokenc(x):return base64.urlsafe_b64encode(json.dumps(x).encode()).decode().rstrip('=')
          def tokend(x):
            try:return json.loads(base64.urlsafe_b64decode(x+'===').decode())
            except:return None
          def get_movies(e):
            q=e.get('queryStringParameters') or {};limit=min(max(int(q.get('limit',24)),1),100) if str(q.get('limit',24)).isdigit() else 24;a={'Limit':limit}
            if q.get('nextToken'):
              k=tokend(q['nextToken'])
              if not k:return out(400,{'success':False,'error':'Invalid pagination token'})
              a['ExclusiveStartKey']=k
            r=movies.scan(**a);d={'success':True,'data':r.get('Items',[]),'count':len(r.get('Items',[]))}
            if r.get('LastEvaluatedKey'):d['nextToken']=tokenc(r['LastEvaluatedKey'])
            return out(200,d)
          def get_movie(e,mid):
            x=movies.get_item(Key={'MovieId':mid}).get('Item');return out(200,{'success':True,'data':x}) if x else out(404,{'success':False,'error':'Movie not found'})
          def create_movie(e):
            u=uid(e)
            if not u:return out(401,{'success':False,'error':'Authentication required'})
            d=body(e);er=validate(d)
            if er:return out(400,{'success':False,'error':'Validation failed','details':er})
            now=datetime.now(timezone.utc).isoformat();item={'MovieId':str(uuid.uuid4()),'MovieName':d['MovieName'].strip(),'createdBy':u,'createdAt':now,'updatedAt':now}
            item.update({k:v for k,v in d.items() if k in FIELDS and k!='MovieName'})
            movies.put_item(Item=item,ConditionExpression='attribute_not_exists(MovieId)');return out(201,{'success':True,'data':item})
          def update_movie(e,mid):
            u=uid(e)
            if not u:return out(401,{'success':False,'error':'Authentication required'})
            d=body(e);er=validate(d,True)
            if er:return out(400,{'success':False,'error':'Validation failed','details':er})
            old=movies.get_item(Key={'MovieId':mid}).get('Item')
            if not old:return out(404,{'success':False,'error':'Movie not found'})
            if old.get('createdBy')!=u and not admin(e):return out(403,{'success':False,'error':'You can only edit your own movies'})
            names={};vals={':u':datetime.now(timezone.utc).isoformat()};parts=['updatedAt=:u']
            for k,v in d.items():names['#'+k]=k;vals[':'+k]=v;parts.append('#'+k+'=:'+k)
            r=movies.update_item(Key={'MovieId':mid},UpdateExpression='SET '+','.join(parts),ExpressionAttributeNames=names,ExpressionAttributeValues=vals,ReturnValues='ALL_NEW');return out(200,{'success':True,'data':r['Attributes']})
          def delete_movie(e,mid):
            if not uid(e):return out(401,{'success':False,'error':'Authentication required'})
            if not admin(e):return out(403,{'success':False,'error':'Admin access required'})
            r=movies.delete_item(Key={'MovieId':mid},ReturnValues='ALL_OLD');return out(200,{'success':True,'message':'Movie deleted'}) if r.get('Attributes') else out(404,{'success':False,'error':'Movie not found'})
          def watch(e,mid=None):
            u=uid(e)
            if not u:return out(401,{'success':False,'error':'Authentication required'})
            m=e.get('httpMethod')
            if m=='GET':return out(200,{'success':True,'data':library.query(KeyConditionExpression=Key('UserId').eq(u)).get('Items',[])})
            if not mid:return out(400,{'success':False,'error':'movie_id required'})
            if m=='PUT':
              movie=movies.get_item(Key={'MovieId':mid}).get('Item')
              if not movie:return out(404,{'success':False,'error':'Movie not found'})
              library.put_item(Item={'UserId':u,'MovieId':mid,'MovieName':movie.get('MovieName',''),'Genre':movie.get('Genre',''),'Rating':movie.get('Rating',0),'addedAt':datetime.now(timezone.utc).isoformat()});return out(200,{'success':True,'message':'Added to watchlist'})
            library.delete_item(Key={'UserId':u,'MovieId':mid});return out(200,{'success':True,'message':'Removed from watchlist'})
          def handler(e,c):
            try:
              m=e.get('httpMethod');p=e.get('path','');mid=(e.get('pathParameters') or {}).get('movie_id')
              if m=='OPTIONS':return out(204,{})
              if '/watchlist' in p:return watch(e,mid)
              if m=='GET':return get_movie(e,mid) if mid else get_movies(e)
              if m=='POST':return create_movie(e)
              if m=='PUT':return update_movie(e,mid)
              if m=='DELETE':return delete_movie(e,mid)
              return out(405,{'success':False,'error':'Method not allowed'})
            except Exception:
              log.exception('Unhandled request');return out(500,{'success':False,'error':'Internal server error','requestId':getattr(c,'aws_request_id','-')})

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties: {Name: !Sub '${ProjectName}-${EnvironmentName}-api', EndpointConfiguration: {Types: [REGIONAL]}}

  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-cognito'
      RestApiId: !Ref Api
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs: [!GetAtt UserPool.Arn]

  MoviesResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref Api, ParentId: !GetAtt Api.RootResourceId, PathPart: movies}
  MovieResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref Api, ParentId: !Ref MoviesResource, PathPart: '{movie_id}'}
  WatchlistResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref Api, ParentId: !GetAtt Api.RootResourceId, PathPart: watchlist}
  WatchlistMovieResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref Api, ParentId: !Ref WatchlistResource, PathPart: '{movie_id}'}

  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MovieApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*'

  GetMovies:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref MoviesResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'}
  PostMovie:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref MoviesResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'}
  GetMovie:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref MovieResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'}
  PutMovie:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref MovieResource
      HttpMethod: PUT
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'}
  DeleteMovie:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref MovieResource
      HttpMethod: DELETE
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'}
  GetWatchlist:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref WatchlistResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'}
  PutWatchlist:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref WatchlistMovieResource
      HttpMethod: PUT
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'}
  DeleteWatchlist:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref WatchlistMovieResource
      HttpMethod: DELETE
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MovieApiFunction.Arn}/invocations'}

  OptionsMovies:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref MoviesResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: {application/json: '{"statusCode": 204}'}
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'https://${FrontendDistribution.DomainName}'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
  OptionsMovie:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref MovieResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: {application/json: '{"statusCode": 204}'}
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'https://${FrontendDistribution.DomainName}'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,PUT,DELETE,OPTIONS'"
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
  OptionsWatchlist:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref WatchlistResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: {application/json: '{"statusCode": 204}'}
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'https://${FrontendDistribution.DomainName}'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
  OptionsWatchlistMovie:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref WatchlistMovieResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: {application/json: '{"statusCode": 204}'}
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'https://${FrontendDistribution.DomainName}'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'PUT,DELETE,OPTIONS'"
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [GetMovies, PostMovie, GetMovie, PutMovie, DeleteMovie, GetWatchlist, PutWatchlist, DeleteWatchlist, OptionsMovies, OptionsMovie, OptionsWatchlist, OptionsWatchlistMovie]
    Properties: {RestApiId: !Ref Api}
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref EnvironmentName
      MethodSettings:
        - {ResourcePath: '/*', HttpMethod: '*', MetricsEnabled: true}
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","status":"$context.status","httpMethod":"$context.httpMethod","path":"$context.path","latency":"$context.responseLatency"}'

Outputs:
  FrontendBucketName: {Value: !Ref FrontendBucket}
  CloudFrontDomainName: {Value: !GetAtt FrontendDistribution.DomainName}
  FrontendUrl: {Value: !Sub 'https://${FrontendDistribution.DomainName}/'}
  ApiUrl: {Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}/movies'}
  CognitoUserPoolId: {Value: !Ref UserPool}
  CognitoClientId: {Value: !Ref UserPoolClient}
  CognitoDomain: {Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.${AWS::URLSuffix}'}
  MovieTableName: {Value: !Ref MovieTable}
  WatchlistTableName: {Value: !Ref UserLibraryTable}
