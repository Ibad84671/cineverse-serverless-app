<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cineverse – Movie Catalog</title>
    <style>
        /* ─── GLOBAL ─── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #3fb950; font-size: 2.5rem; margin-bottom: 8px; }
        .subtitle { color: #8b949e; margin-bottom: 30px; }

        /* ─── AUTH BAR ─── */
        .auth-bar {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 20px;
        }
        .auth-bar input {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            font-size: 0.9rem;
        }
        .auth-bar input:focus { outline: none; border-color: #3fb950; }
        .auth-bar button {
            padding: 8px 18px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-login { background: #3fb950; color: #0d1117; }
        .btn-login:hover { background: #2ea043; }
        .btn-logout { background: #f85149; color: #0d1117; }
        .btn-logout:hover { background: #da3633; }
        .auth-status { color: #8b949e; font-size: 0.9rem; }

        /* ─── FORM ─── */
        .add-form {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }
        .form-grid input, .form-grid button {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            font-size: 0.9rem;
        }
        .form-grid input:focus { outline: none; border-color: #3fb950; }
        .form-grid button {
            background: #3fb950;
            color: #0d1117;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .form-grid button:hover { background: #2ea043; }

        /* ─── MOVIE GRID ─── */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .movie-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            transition: border-color 0.3s;
        }
        .movie-card:hover { border-color: #3fb950; }
        .movie-card .title { font-size: 1.1rem; font-weight: 600; color: #e6edf3; }
        .movie-card .year { color: #8b949e; font-size: 0.85rem; }
        .movie-card .rating { color: #d29922; font-weight: 600; }
        .movie-card .delete-btn {
            background: #f85149;
            color: #0d1117;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-top: 8px;
        }
        .movie-card .delete-btn:hover { background: #da3633; }

        /* ─── STATES ─── */
        .loading { color: #8b949e; text-align: center; padding: 40px; }
        .error { color: #f85149; text-align: center; padding: 20px; }
        .empty { color: #8b949e; text-align: center; padding: 40px; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            color: #0d1117;
            font-weight: 600;
            display: none;
        }
        .toast.success { background: #3fb950; display: block; }
        .toast.error { background: #f85149; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <h1>🎬 Cineverse</h1>
        <p class="subtitle">Your serverless movie catalog</p>

        <!-- Authentication Bar -->
        <div class="auth-bar" id="authBar">
            <div class="auth-status" id="authStatus">🔒 Not authenticated</div>
            <button class="btn-login" id="loginBtn">Login / Signup</button>
            <button class="btn-logout" id="logoutBtn" style="display:none;">Logout</button>
        </div>

        <!-- Add Movie Form -->
        <div class="add-form" id="addForm" style="display:none;">
            <div class="form-grid">
                <input type="text" id="movieName" placeholder="Movie Name" required>
                <input type="number" id="releaseYear" placeholder="Year">
                <input type="number" id="rating" placeholder="Rating (0-10)" step="0.1">
                <input type="text" id="genre" placeholder="Genre">
                <button id="addBtn">+ Add Movie</button>
            </div>
        </div>

        <!-- Movie Grid -->
        <div id="movieGrid" class="movie-grid">
            <div class="loading">Loading movies...</div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- ─── CONFIG ─── -->
    <script src="config.js"></script>

    <!-- ─── APPLICATION ─── -->
    <script>
        // ─── STATE ──────────────────────────────────────────────────────
        const TOKEN_KEY = 'idToken';
        let authToken = null;

        // ─── DOM REFS ──────────────────────────────────────────────────
        const grid = document.getElementById('movieGrid');
        const addForm = document.getElementById('addForm');
        const authStatus = document.getElementById('authStatus');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        // ─── TOKEN HELPERS ─────────────────────────────────────────────
        function getToken() {
            return sessionStorage.getItem(TOKEN_KEY);
        }

        function setToken(token) {
            sessionStorage.setItem(TOKEN_KEY, token);
            authToken = token;
            updateAuthUI();
        }

        function clearToken() {
            sessionStorage.removeItem(TOKEN_KEY);
            authToken = null;
            updateAuthUI();
        }

        function isAuthenticated() {
            const token = getToken();
            if (!token) return false;
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                return payload.exp * 1000 > Date.now();
            } catch { return false; }
        }

        function getHeaders() {
            const token = getToken();
            return {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {})
            };
        }

        // ─── UI HELPERS ─────────────────────────────────────────────────
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        function updateAuthUI() {
            const authenticated = isAuthenticated();
            authStatus.textContent = authenticated ? '🔓 Authenticated' : '🔒 Not authenticated';
            loginBtn.style.display = authenticated ? 'none' : 'inline-block';
            logoutBtn.style.display = authenticated ? 'inline-block' : 'none';
            addForm.style.display = authenticated ? 'block' : 'none';
        }

        // ─── API ────────────────────────────────────────────────────────
        async function fetchMovies() {
            grid.innerHTML = '<div class="loading">Loading movies...</div>';
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                renderMovies(data.movies || []);
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="error">Failed to load movies</div>';
            }
        }

        async function addMovie(movie) {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify(movie)
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Failed to add movie');
                }
                showToast('✅ Movie added!');
                fetchMovies();
            } catch (err) {
                showToast(`❌ ${err.message}`, 'error');
            }
        }

        async function deleteMovie(movieId) {
            if (!confirm('Delete this movie?')) return;
            try {
                const res = await fetch(`${API_URL}/${movieId}`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });
                if (!res.ok) throw new Error(await res.text());
                showToast('🗑️ Movie deleted');
                fetchMovies();
            } catch (err) {
                showToast(`❌ ${err.message}`, 'error');
            }
        }

        // ─── RENDER ─────────────────────────────────────────────────────
        function renderMovies(movies) {
            if (!movies || movies.length === 0) {
                grid.innerHTML = '<div class="empty">No movies yet. Add one above!</div>';
                return;
            }
            grid.innerHTML = movies.map(m => {
                const title = escapeHtml(m.MovieName || 'Untitled');
                const year = m.ReleaseYear || '';
                const rating = m.Rating || '';
                const genre = m.Genre || '';
                const movieId = m.MovieId || '';
                const isOwn = m.createdBy === (authToken ? JSON.parse(atob(authToken.split('.')[1]))?.sub : null);
                return `
                    <div class="movie-card">
                        <div class="title">${title}</div>
                        <div class="year">${year}${genre ? ' · ' + escapeHtml(genre) : ''}</div>
                        ${rating ? `<div class="rating">⭐ ${rating}/10</div>` : ''}
                        ${isOwn ? `<button class="delete-btn" onclick="deleteMovie('${movieId}')">Delete</button>` : ''}
                    </div>
                `;
            }).join('');
        }

        // ─── AUTH FLOW ──────────────────────────────────────────────────
        function redirectToCognito() {
            // In a real app, redirect to Cognito Hosted UI or show login modal
            // For demo, we'll use a simple prompt (replace with real Cognito flow)
            const email = prompt('Enter your email (for demo token):');
            if (email) {
                // Simulate a token (replace with actual Cognito auth)
                // This is for demo only – real implementation uses Cognito Hosted UI
                showToast('🔑 Please implement Cognito Hosted UI for real auth', 'error');
                // For demo, we'll store a dummy token
                // In production, use Amazon Cognito Hosted UI or Amplify
                setToken('demo-token-' + Date.now());
                fetchMovies();
            }
        }

        loginBtn.addEventListener('click', redirectToCognito);
        logoutBtn.addEventListener('click', () => {
            clearToken();
            fetchMovies();
            showToast('🔒 Logged out');
        });

        // ─── ADD BUTTON ─────────────────────────────────────────────────
        document.getElementById('addBtn').addEventListener('click', () => {
            const name = document.getElementById('movieName').value.trim();
            const year = document.getElementById('releaseYear').value;
            const rating = document.getElementById('rating').value;
            const genre = document.getElementById('genre').value.trim();
            if (!name) { showToast('❌ Movie name required', 'error'); return; }
            addMovie({
                MovieName: name,
                ReleaseYear: year ? parseInt(year) : '',
                Rating: rating ? parseFloat(rating) : '',
                Genre: genre || ''
            });
            document.getElementById('movieName').value = '';
            document.getElementById('releaseYear').value = '';
            document.getElementById('rating').value = '';
            document.getElementById('genre').value = '';
        });

        // ─── INIT ──────────────────────────────────────────────────────
        updateAuthUI();
        fetchMovies();
    </script>
</body>
</html>
