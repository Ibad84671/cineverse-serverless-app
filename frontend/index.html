<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cineverse – Movie Catalog</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #3fb950; font-size: 2.5rem; margin-bottom: 8px; }
        .subtitle { color: #8b949e; margin-bottom: 30px; }
        .add-form { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .form-grid input, .form-grid button { padding: 10px 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 0.9rem; }
        .form-grid input:focus { outline: none; border-color: #3fb950; }
        .form-grid button { background: #3fb950; color: #0d1117; font-weight: 600; cursor: pointer; border: none; }
        .form-grid button:hover { background: #2ea043; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .movie-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; transition: border-color 0.3s; }
        .movie-card:hover { border-color: #3fb950; }
        .movie-card .title { font-size: 1.1rem; font-weight: 600; color: #e6edf3; }
        .movie-card .year { color: #8b949e; font-size: 0.85rem; }
        .movie-card .rating { color: #d29922; font-weight: 600; }
        .movie-card .delete-btn { background: #f85149; color: #0d1117; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; margin-top: 8px; }
        .movie-card .delete-btn:hover { background: #da3633; }
        .loading { color: #8b949e; text-align: center; padding: 40px; }
        .error { color: #f85149; text-align: center; padding: 20px; }
        .empty { color: #8b949e; text-align: center; padding: 40px; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; border-radius: 8px; color: #0d1117; font-weight: 600; display: none; }
        .toast.success { background: #3fb950; display: block; }
        .toast.error { background: #f85149; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Cineverse</h1>
        <p class="subtitle">Your serverless movie catalog</p>

        <div class="add-form">
            <div class="form-grid">
                <input type="text" id="movieName" placeholder="Movie Name" required>
                <input type="number" id="releaseYear" placeholder="Year">
                <input type="number" id="rating" placeholder="Rating (0-10)" step="0.1">
                <input type="text" id="genre" placeholder="Genre">
                <button id="addBtn">+ Add Movie</button>
            </div>
        </div>

        <div id="movieGrid" class="movie-grid">
            <div class="loading">Loading movies...</div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- ─── CONFIGURATION (generated by CD pipeline) ─── -->
    <script src="config.js"></script>

    <!-- ─── APPLICATION CODE ─── -->
    <script>
        const TOKEN_KEY = 'idToken';

        function getToken() {
            return sessionStorage.getItem(TOKEN_KEY);
        }

        function setToken(token) {
            sessionStorage.setItem(TOKEN_KEY, token);
        }

        function clearToken() {
            sessionStorage.removeItem(TOKEN_KEY);
        }

        function getHeaders() {
            const token = getToken();
            return {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {})
            };
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        async function fetchMovies() {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<div class="loading">Loading movies...</div>';
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                renderMovies(data.movies || []);
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="error">Failed to load movies</div>';
            }
        }

        async function addMovie(movie) {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify(movie)
                });
                if (!res.ok) throw new Error(await res.text());
                showToast('✅ Movie added!');
                fetchMovies();
            } catch (err) {
                showToast(`❌ ${err.message}`, 'error');
            }
        }

        async function deleteMovie(movieId) {
            if (!confirm('Delete this movie?')) return;
            try {
                const res = await fetch(`${API_URL}/${movieId}`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });
                if (!res.ok) throw new Error(await res.text());
                showToast('🗑️ Movie deleted');
                fetchMovies();
            } catch (err) {
                showToast(`❌ ${err.message}`, 'error');
            }
        }

        function renderMovies(movies) {
            const grid = document.getElementById('movieGrid');
            if (!movies || movies.length === 0) {
                grid.innerHTML = '<div class="empty">No movies yet</div>';
                return;
            }
            grid.innerHTML = movies.map(m => {
                const title = escapeHtml(m.MovieName || 'Untitled');
                const year = m.ReleaseYear || '';
                const rating = m.Rating || '';
                const genre = m.Genre || '';
                const movieId = m.MovieId || '';
                return `
                    <div class="movie-card">
                        <div class="title">${title}</div>
                        <div class="year">${year}${genre ? ' · ' + escapeHtml(genre) : ''}</div>
                        ${rating ? `<div class="rating">⭐ ${rating}/10</div>` : ''}
                        <button class="delete-btn" onclick="deleteMovie('${movieId}')">Delete</button>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('addBtn').addEventListener('click', () => {
            const name = document.getElementById('movieName').value.trim();
            const year = document.getElementById('releaseYear').value;
            const rating = document.getElementById('rating').value;
            const genre = document.getElementById('genre').value.trim();
            if (!name) { showToast('❌ Movie name required', 'error'); return; }
            addMovie({
                MovieName: name,
                ReleaseYear: year ? parseInt(year) : '',
                Rating: rating ? parseFloat(rating) : '',
                Genre: genre || ''
            });
            document.getElementById('movieName').value = '';
            document.getElementById('releaseYear').value = '';
            document.getElementById('rating').value = '';
            document.getElementById('genre').value = '';
        });

        fetchMovies();
    </script>
</body>
</html>
